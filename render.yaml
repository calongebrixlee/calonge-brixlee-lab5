services:
  - type: web
    name: lavalust-product-crud
    runtime: docker
    plan: free
    healthCheckPath: /index.php/login
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_SSL_CA
        value: certs/ca.pem
      - key: DB_SSL_VERIFY
        value: "1"
      - key: AUTH_USERNAME
        sync: false
      - key: AUTH_PASSWORD_HASH
        sync: false